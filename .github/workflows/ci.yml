name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Rust Build
      run: cd runtime && cargo check
    - name: Idris Check
      run: cd formal && idris2 --check *.idr || echo "Idris check placeholder - install idris2 in CI later"
name: Q-Reg CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run unit tests (9-vector adversarial suite)
      run: |
        pytest test_vectors.py -v --tb=short

    - name: Verify Merkle tree correctness
      run: |
        python kerna_verify.py --check-merkle

    - name: Validate Ed25519 signatures
      run: |
        python qreg_engine.py --validate-signatures

    - name: Generate coverage report
      run: |
        pytest test_vectors.py --cov=qreg_engine --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml

    - name: Lock Merkle regression
      run: |
        python qreg_engine.py --demo > ledger_regression.jsonl
        git add ledger_regression.jsonl || true

    - name: Artifact: Regression ledger
      uses: actions/upload-artifact@v3
      with:
        name: ledger-regression-${{ matrix.python-version }}
        path: ledger_regression.jsonl
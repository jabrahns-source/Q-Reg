name: CI (Dockerized Idris2 + Rust)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker CI Image (with logs)
        run: |
          docker build --progress=plain -t qreg-ci . 2>&1 | tail -100

      - name: Run Verification
        run: docker run --rm qreg-ci

      - name: Native Rust Polish (fast feedback)
        run: |
          rustup default stable
          cd runtime
          cargo fmt -- --check || true
          cargo clippy --all-targets -- -D warnings || true
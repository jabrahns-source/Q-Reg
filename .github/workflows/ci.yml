name: Q-Reg CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python Verification (Free Runner)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest test_vectors.py -v --tb=short

      - name: Z3 gate logic verification
        run: python verification/verify_gate_logic.py

      - name: Generate deterministic demo ledger
        run: python qreg_engine.py --demo

      - name: Verify Merkle tree
        run: python kerna_verify.py --ledger ledger.jsonl --check-merkle

      - name: Validate Ed25519 signatures
        run: python kerna_verify.py --ledger ledger.jsonl --validate-signatures

      - name: Upload ledger artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-${{ matrix.python-version }}
          path: ledger.jsonl
          if-no-files-found: ignore

  rust-runtime:
    name: Rust runtime host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check + run gate surface
        working-directory: runtime
        run: |
          cargo check --locked=false
          cargo run --quiet
      - name: artifact hygiene
        run: |
          ! find . -type d \( -name target -o -name node_modules -o -name __pycache__ -o -name dist \) -not -path './.git/*' | grep .
          ! find . -name '*.pyc' | grep .

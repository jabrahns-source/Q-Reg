name: GridPulse Verification + Kerna-Ledger Report

on:
  workflow_dispatch:
    inputs:
      telemetry_source:
        description: 'Telemetry source'
        required: false
        default: 'sample'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dockerized Formal Verification
        run: |
          docker build -t qreg-ci .
          docker run --rm qreg-ci sh -c "cd formal && idris2 --check *.idr && echo 'GridPulse models verified'"

      - name: Generate Signed Draft Report
        run: |
          cat > report.json << EOF
          {
            "status": "verified",
            "source": "${{ github.event.inputs.telemetry_source }}",
            "timestamp": "$(date -Iseconds)",
            "proof": "Idris2 + Docker CI passed",
            "repo": "Q-Reg/Kerna-Ledger"
          }
          EOF

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kerna-ledger-report
          path: report.json